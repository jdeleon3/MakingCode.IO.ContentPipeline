[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ce"
version = "0.1.0"
description = "Content Engine - project-triggered content pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John" }]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
ce = "ce.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ce"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # typer uses function calls in argument defaults by design
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ce"]
