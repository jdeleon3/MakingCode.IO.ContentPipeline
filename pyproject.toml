[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ce"
version = "0.1.0"
description = "Content Engine - project-triggered content pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John" }]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "perplexityai>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# WP-11's PlaywrightScreenshotRenderer imports this lazily (behind a
# ScreenshotRenderer Protocol, same DI shape as WP-04's ffmpeg seam) and
# raises a readable AssetError if it's missing -- kept optional rather than
# a hard dependency because `pip install` alone doesn't make it usable:
# `playwright install chromium` is a separate, large (~300MB) download step
# beyond what every other WP's dependencies needed.
assets = [
    "playwright>=1.40",
]
# WP-17 (TDD 10.10, ADR-009): server-rendered FastAPI + Jinja2 + HTMX GUI.
# Optional like `assets` -- the CLI is fully usable without it; `ce gui`
# raises a readable error if these aren't installed rather than being a hard
# dependency every operator pays for.
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
ce = "ce.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ce"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # typer uses function calls in argument defaults by design
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ce"]
