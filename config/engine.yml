# Content Engine configuration (TDD §8). Hand-written, not generated.
#
# Sections marked "EDIT THIS" have placeholder values that won't work
# as-is. Everything else is a reasonable default — tweak only if you
# know you want something different. Run `ce doctor` after editing to
# confirm the required API keys are set (keys themselves are environment
# variables, never written here — TDD §14).

identity: # EDIT THIS
  name: John DeLeon
  site_url: https://makingcode.io
  site_repo: C:\Projects\MakingCode.IO.Site
  timezone: America/Chicago

repos: # EDIT THIS — G1's allowlist. Anything not listed here is
  # invisible to the pipeline, full stop.
  allowed:
    - name: Content Engine
      path: C:\Projects\MakingCode.IO.ContentPipeline
      publishable: full # full | lessons-only      

llm:
  provider: anthropic
  models:
    reasoning: claude-opus-5 # briefs, grading
    default: claude-sonnet-5 # drafting, renditions
    cheap: claude-haiku-4-5 # classification, cleanup
  budget:
    monthly_usd: 20
    per_run_usd: 2.00
    on_exceed: halt # halt | degrade
  retry:
    max_attempts: 4
    backoff_base_sec: 2

transcription:
  provider: openai
  model: gpt-4o-mini-transcribe
  vocabulary: [] # EDIT THIS — project-specific jargon that reduces ASR
    # mishearings, e.g. [DuckDB, Astro, Cloudflare]
  preprocess:
    silence_threshold_db: -40
    silence_min_sec: 1.5
    loudnorm: true

embeddings:
  provider: openai
  model: text-embedding-3-small

gates:
  allowlist: hard_fail # not configurable to anything else (ADR-005)
  secrets: hard_fail # not configurable to anything else (ADR-005)
  dedupe:
    threshold: 0.88
    scope_days: 365
  claims:
    enabled: true
    block_on_unverifiable: true

produce:
  min_grade: 8.0
  max_attempts: 3
  grade_weights:
    hook: 0.30
    evidence: 0.30
    specificity: 0.20
    voice: 0.10
    cta: 0.10

harvest:
  git:
    lookback_days: 60
    min_significance: 2
  research:
    max_sources: 8
    provider: gemini # gemini | duckduckgo | perplexity
    # gemini needs GEMINI_API_KEY, perplexity needs PERPLEXITY_API_KEY;
    # duckduckgo needs no key at all if you'd rather not manage one.
  inventory:
    min_briefs: 6
    max_briefs: 8

utm:
  template: "?utm_source={platform}&utm_medium=social&utm_campaign={slug}"

analytics: # EDIT THIS — self-hosted Umami instance tracking identity.site_url.
  # UMAMI_API_KEY is the actual secret (environment variable, never here).
  umami:
    api_url: https://umami.example.com
    website_id: 00000000-0000-0000-0000-000000000000

sweep: # EDIT THIS — this operator's own demand-signal watch-list. Matched
  # case-insensitively as a substring against HN/RSS story titles; no API
  # key needed for either source.
  topics:
    - DuckDB
    - AI agents
    - LLM evals
    - data engineering
    - Astro
  rss_feeds:
    - https://www.reddit.com/r/dataengineering/.rss
    - https://www.reddit.com/r/MachineLearning/.rss
